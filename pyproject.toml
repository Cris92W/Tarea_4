[project]
name = "tarea-4-agente"
version = "0.1.0"
description = "Agente de investigación socioeconómica: MCP del BCRP, Skills de la ENAHO 2024 y evaluación con Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["mcp"]
